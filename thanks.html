<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Merci</title>

  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- =====BOX ICONS===== -->
  <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>

  <!-- Styles spécifiques à la page "Merci" -->
  <style>
    :root {
      /* fallback au cas où, reprend tes couleurs */
      --first-color: #4070F4;
      --second-color: #0E2431;
    }

    body {
      background: linear-gradient(180deg, #f6f8fb 0%, #eef3ff 100%);
      color: var(--second-color);
    }

    .ty {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem var(--mb-2);
    }

    .ty__card {
      position: relative;
      width: 100%;
      max-width: 780px;
      background: #fff;
      border: 1px solid rgba(64,112,244,.14);
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(14,36,49,.08);
      padding: 2rem 1.5rem;
      overflow: hidden;
      animation: ty-fade .35s ease-out both;
    }

    /* Liseré dégradé à gauche */
    .ty__card::before {
      content: "";
      position: absolute; inset: 0 auto 0 0;
      width: 4px;
      background: linear-gradient(180deg, #6da4ff, var(--first-color));
    }

    /* Badge icône */
    .ty__icon {
      width: 64px; height: 64px;
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(64,112,244,.08);
      border: 1px solid rgba(64,112,244,.18);
      color: var(--first-color);
      box-shadow: 0 6px 16px rgba(64,112,244,.15);
      margin-bottom: 1rem;
      animation: ty-pop .28s ease-out both;
    }

    .ty__title {
      font-size: clamp(1.6rem, 2.4vw, 2rem);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 .5rem 0;
      font-weight: 700;
      color: var(--second-color);
    }

    .ty__text {
      margin: 0;
      opacity: .92;
      line-height: 1.55;
    }

    .ty__actions {
      margin-top: 1.25rem;
      display: flex; flex-wrap: wrap; gap: .6rem;
    }

    /* Bouton principal = ta classe .button existante */
    .button { border-radius: .6rem; }

    /* Bouton secondaire (outline) */
    .button--ghost {
      display: inline-block;
      padding: .7rem 1.2rem;
      border-radius: .6rem;
      border: 1px solid rgba(64,112,244,.25);
      color: var(--first-color);
      background: transparent;
      font-weight: 600;
    }
    .button--ghost:hover { box-shadow: 0 10px 24px rgba(64,112,244,.12); }

    /* Animations */
    @keyframes ty-fade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes ty-pop {
      from { transform: scale(.9); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    /* Petits confettis subtils */
    .ty__dots {
      position: absolute; inset: -40px -10px auto auto; width: 220px; height: 220px;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(64,112,244,.18) 99%, transparent) ,
        radial-gradient(2px 2px at 60% 70%, rgba(64,112,244,.12) 99%, transparent) ,
        radial-gradient(2px 2px at 80% 20%, rgba(64,112,244,.16) 99%, transparent) ;
      opacity: .6;
      pointer-events: none;
    }

    @media (min-width: 768px){
      .ty__card { padding: 2.25rem 2rem; }
    }
  </style>
</head>

<body>
  <main class="ty">
    <section class="ty__card" aria-labelledby="ty-title">
      <div class="ty__dots"></div>

     

      <h1 id="ty-title" class="ty__title">Merci&nbsp;!</h1>
      <p class="ty__text">
        Votre message a bien été envoyé. Je reviens vers vous très vite.
      </p>

      <div class="ty__actions">
        <a href="/" class="button">← Retour au portfolio</a>
        <a href="/#work" class="button--ghost">Voir mes projets</a>
        <a href="/#contact" class="button--ghost">M’écrire à nouveau</a>
      </div>
    </section>
  </main>

  <!-- Redirection automatique optionnelle (décommente si tu veux revenir à l’accueil après 4s) -->

</body>
</html>
